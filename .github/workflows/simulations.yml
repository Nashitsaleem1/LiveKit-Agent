# Runs the conversations in scenarios.yaml against Ava, with the mock company API and the
# mock Claude webhook running next to her. Simulations use real LiveKit Inference (billed),
# so this only runs when you start it: Actions > Simulations > Run workflow.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
# LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
name: Simulations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      NOISE_CANCELLATION: "off"
      INTERNAL_API_URL: http://127.0.0.1:8081
      CLAUDE_WEBHOOK_URL: http://127.0.0.1:8082/skills/run

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync

    - name: Create throwaway secrets for the mock servers
      run: |
        echo "INTERNAL_API_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
        echo "CLAUDE_WEBHOOK_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

    - name: Start the mock company API and mock Claude webhook
      run: |
        nohup uv run python mocks/internal_api.py > mock-api.log 2>&1 &
        nohup uv run python mocks/claude_webhook.py > mock-claude.log 2>&1 &
        sleep 5

    - name: Download model files
      run: uv run python src/agent.py download-files

    - name: Install LiveKit CLI
      run: curl -sSL https://get.livekit.io/cli | bash

    - name: Run simulations
      run: lk agent simulate text --scenarios scenarios.yaml
